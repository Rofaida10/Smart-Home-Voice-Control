[platformio]
description = Smart Home Voice Assistant — ESP32 DevKit V1

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

build_flags =
    -std=gnu++17
    -DWIFI_SSID=\""${sysenv.WIFI_SSID}\""
    -DWIFI_PASSWORD=\""${sysenv.WIFI_PASSWORD}\""
    -DSUPABASE_URL=\""${sysenv.SUPABASE_URL}\""
    -DSUPABASE_KEY=\""${sysenv.SUPABASE_KEY}\""
    -DDEVICE_ID=\""${sysenv.DEVICE_ID}\""

lib_deps =
    adafruit/DHT sensor library
    adafruit/Adafruit Unified Sensor
    bblanchon/ArduinoJson@^7.0.0

monitor_filters =
    time
